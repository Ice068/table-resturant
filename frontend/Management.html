<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Reservations</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="Management.css">
</head>

<body>

<!-- ===== TOP NAVBAR ===== -->
<nav class="topbar">
    <div class="d-flex justify-content-between align-items-center w-100 px-4">

        <!-- Left -->
        <div class="topbar-left">
            <span class="menu-toggle" onclick="toggleSidebar()">☰</span>
            <span class="title">Admin Dashboard</span>
        </div>

        <!-- Right -->
        <div class="topbar-right">
            <span class="admin-name">Admin</span>
            <img src="https://i.pravatar.cc/40" class="avatar">
        </div>

    </div>
</nav>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar" id="sidebar">
    <h3>ECLIPSE</h3>
    <a href="admin-dashboard.html" class="active">📊 Dashboard</a>
    <a href="Management.html">📋 Management</a>
    <a href="Table-Status.html">🍽 Tables</a>

    <a href="login-admin.html" onclick="logout()">🚪 Logout</a>
</div>

<!-- ===== CONTENT ===== -->
<div class="content" id="content">

<h2 class="mb-4">Reservation Management</h2>

<!-- Filters -->
<div class="row mb-3">
    <div class="col-md-4">
        <input type="text" id="search" class="form-control" placeholder="Search name or email">
    </div>

    <div class="col-md-3">
        <input type="date" id="filterDate" class="form-control">
    </div>

    <div class="col-md-3">
        <select id="filterStatus" class="form-control">
            <option value="">All Status</option>
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="cancelled">Cancelled</option>
        </select>
    </div>
</div>

<!-- Table -->
<table class="table table-bordered">
<thead class="table-dark">
<tr>
    <th>#</th>
    <th>Name</th>
    <th>Email</th>
    <th>Date</th>
    <th>Time</th>
    <th>Guests</th>
    <th>Status</th>
    <th>Action</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>
</table>

</div>

<script src="Management.js"></script>

<!-- ===== SCRIPT ===== -->
<script>
function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("hide");
    document.getElementById("content").classList.toggle("full");
}

function logout(){
    localStorage.removeItem("adminToken");
    window.location.href = "login-admin.html";
}

// 🔒 กันเข้าหน้านี้ถ้าไม่ login
if(!localStorage.getItem("adminToken")){
    window.location.href = "login-admin.html";
}
</script>

</body>
</html>
