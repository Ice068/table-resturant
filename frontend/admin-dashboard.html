<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Eclipse</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
</head>

<body>

<!-- ===== TOP NAVBAR ===== -->
<nav class="topbar">
    <div class="d-flex justify-content-between align-items-center w-100 px-4">

        <!-- Left -->
        <div class="topbar-left">
            <span class="menu-toggle" onclick="toggleSidebar()">☰</span>
            <span class="title">Admin Dashboard</span>
        </div>

        <!-- Right -->
        <div class="topbar-right">
            <span class="admin-name">Admin</span>
            <img src="https://i.pravatar.cc/40" class="avatar">
        </div>

    </div>
</nav>

<!-- ===== SIDEBAR ===== -->
<div class="sidebar" id="sidebar">
    <h3>ECLIPSE</h3>
    <a href="admin-dashboard.html" class="active">📊 Dashboard</a>
    <a href="Management.html">📋 Management</a>
    <a href="Table-Status.html">🍽 Tables</a>

    <a href="login-admin.html" onclick="logout()">🚪 Logout</a>
</div>

<!-- ===== CONTENT ===== -->
<div class="content" id="content">

    <h2 class="mb-4">Dashboard</h2>

    <!-- Stats -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card-box">
                <h3 id="total">0</h3>
                <p>Total Reservations</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card-box">
                <h3 id="today">0</h3>
                <p>Today</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card-box">
                <h3 id="available">10</h3>
                <p>Available Tables</p>
            </div>
        </div>
    </div>

    <!-- Chart -->
    <h4 class="mb-3">Reservations Overview</h4>
    <canvas id="chart" height="100"></canvas>

    <!-- Recent -->
    <h4 class="mt-5">Recent Reservations</h4>

    <table class="table table-bordered mt-3">
        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Date</th>
                <th>Time</th>
                <th>Guests</th>
            </tr>
        </thead>
        <tbody id="recentTable"></tbody>
    </table>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="dashboard.js"></script>

<!-- ===== SCRIPT ===== -->
<script>
function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("hide");
    document.getElementById("content").classList.toggle("full");
}

function logout(){
    localStorage.removeItem("adminToken");
    window.location.href = "login-admin.html";
}
</script>

</body>
</html>
