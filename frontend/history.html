<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservation History - Eclipse</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="history.css">

</head>

<body>

<div class="container">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Reservation History</h1>

    <!-- 🔍 Search -->
    <input type="text" id="searchInput" class="form-control search-box" placeholder="Search name/email...">
  </div>

  <div id="loading" class="text-center">Loading...</div>

  <div id="errorMsg" class="alert alert-danger d-none"></div>

  <div class="table-responsive d-none" id="tableWrapper">
    <table class="table table-bordered text-center align-middle">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Email</th>
          <th>Date</th>
          <th>Time</th>
          <th>Guests</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <a href="Reserve Your Table.html" class="btn btn-gold mt-3">
    ← Back to Reservation
  </a>

</div>

<script src="history.js"></script>

</body>
</html>
