<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservation - Eclipse</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="table.css">
</head>
<body>

<!-- ===== Navbar ===== -->
<header>
  <nav class="navbar navbar-expand-lg fixed-top custom-navbar" id="navbar">
    <div class="container-fluid px-5">
      
      <a class="navbar-brand logo" href="index.html">ECLIPSE</a>

      <button class="navbar-toggler text-white" 
              type="button" 
              data-bs-toggle="collapse" 
              data-bs-target="#navMenu"
              aria-controls="navMenu"
              aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-end" id="navMenu">
        <ul class="navbar-nav align-items-lg-center gap-lg-3">

          <li class="nav-item">
            <a class="menu-link nav-link" href="history.html">History</a>
          </li>

          <li class="nav-item">
            <a class="menu-link nav-link" href="visit-us.html">Visit Us</a>
          </li>

          <li class="nav-item">
            <a class="menu-link nav-link" href="Dining&Drink.html">Dining & Drinks</a>
          </li>

          <li class="nav-item">
            <a class="reservation-btn ms-lg-3" href="#">
              RESERVATIONS
            </a>
          </li>

        </ul>
      </div>

    </div>
  </nav>
</header>

<!-- ===== Form Section ===== -->
<main>
  <div class="container d-flex justify-content-center">
    
    <div class="form-box">

      <h2 class="title">Table Reservation</h2>

      <form id="reservationForm">

        <div class="mb-3">
          <label>Full Name</label>
          <input type="text" id="fullname" class="form-control" required>
        </div>

        <div class="mb-3">
          <label>Email</label>
          <input type="email" id="email" class="form-control" required>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label>Date</label>
            <input type="date" id="date" class="form-control" required>
          </div>

          <div class="col-md-6 mb-3">
            <label>Time</label>
            <select id="time" class="form-control" required>
              <option value="">-- Select Time --</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label>Guests</label>
          <input type="number" id="guests" class="form-control" min="1" max="10" required>
        </div>

        <div class="mb-4">
          <label>Special Request</label>
          <textarea id="note" class="form-control"></textarea>
        </div>

        <button type="submit" class="btn btn-gold w-100">
          Confirm Reservation
        </button>

      </form>

    </div>

  </div>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script src="table.js"></script>

</body>
</html>
