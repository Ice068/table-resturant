<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Eclipse Restaurant - Fine Dining Experience">
  <title>Eclipse Restaurant</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- ===== Navbar ===== -->
<header>
  <nav class="navbar navbar-expand-lg fixed-top custom-navbar" id="navbar">
    <div class="container-fluid px-5">
      
      <a class="navbar-brand logo" href="index.html">ECLIPSE</a>

      <!-- ปุ่ม hamburger -->
      <button class="navbar-toggler text-white" 
              type="button" 
              data-bs-toggle="collapse" 
              data-bs-target="#navMenu"
              aria-controls="navMenu"
              aria-expanded="false"
              aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- เมนู -->
      <div class="collapse navbar-collapse justify-content-end" id="navMenu">
        <ul class="navbar-nav align-items-lg-center gap-lg-3">

          <li class="nav-item">
            <a class="menu-link nav-link" href="history.html">History</a>
          </li>

          <li class="nav-item">
            <a class="menu-link nav-link" href="visit-us.html">Visit Us</a>
          </li>

          <li class="nav-item">
            <a class="menu-link nav-link" href="Dining&Drink.html">Dining & Drinks</a>
          </li>

          <li class="nav-item">
            <a class="reservation-btn btn btn-warning ms-lg-3" href="Reserve Your Table.html">
              RESERVATIONS
            </a>
          </li>

        </ul>
      </div>

    </div>
  </nav>
</header>


<!-- ===== Hidden Admin Button ===== -->
<a href="login-admin.html" class="admin-secret" title="Admin"></a>


<!-- ===== Hero Section ===== -->
<main>
  <section class="hero d-flex align-items-center justify-content-center text-center">
    <div class="hero-content">
      <h1>ECLIPSE</h1>
      <p>FINE DINING EXPERIENCE</p>
      <a href="Reserve Your Table.html" class="hero-btn btn btn-light">
        RESERVE NOW
      </a>
    </div>

    <div class="scroll-down">
      SCROLL
    </div>
  </section>
</main>

<!-- ===== Scripts ===== -->
<script>
  // เปลี่ยนสี navbar ตอน scroll
  const navbar = document.getElementById("navbar");

  window.addEventListener("scroll", () => {
    navbar.classList.toggle("nav-scrolled", window.scrollY > 50);
  });

  document.addEventListener("keydown", function(e){
    if(e.ctrlKey && e.shiftKey && e.key === "A"){
        window.location.href = "admin-login.html";
    }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
