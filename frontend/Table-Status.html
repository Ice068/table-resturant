<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Table Status - Eclipse</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="Table-Status.css">
</head>

<body>

<div class="container">

<h2 class="mb-4">Table Status</h2>

<!-- Legend -->
<div class="legend">
    <div><span class="dot green"></span> Available</div>
    <div><span class="dot gold"></span> Reserved</div>
    <div><span class="dot red"></span> Occupied</div>
</div>

<!-- Grid -->
<div class="table-grid" id="tableGrid"></div>

</div>

<script src="Table-Status.js"></script>

</body>
</html>
